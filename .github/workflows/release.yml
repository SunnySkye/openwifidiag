# Release pipeline: build binaries for all platforms and publish to npm.
# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`).
# Requires an `NPM_TOKEN` repository secret (npm granular access token with publish rights).
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, npm: darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, npm: darwin-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, npm: linux-x64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, npm: linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, npm: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }
      - name: Install aarch64-linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p artifacts/${{ matrix.npm }}
          BIN=$( [ "${{ matrix.os }}" = "windows-latest" ] && echo openwifidiag.exe || echo openwifidiag )
          cp "target/${{ matrix.target }}/release/${BIN}" artifacts/${{ matrix.npm }}/${BIN}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm }}
          path: artifacts/${{ matrix.npm }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble platform packages
        run: node scripts/pack.js
      - name: Publish platform packages
        env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }
        run: |
          set -e
          for dir in npm/openwifidiag-*; do
            if [ -f "$dir/bin/openwifidiag" ] || [ -f "$dir/bin/openwifidiag.exe" ]; then
              npm publish --access public "$dir"
            fi
          done
          npm publish --access public .
