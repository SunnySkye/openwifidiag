name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify binary
        shell: pwsh
        run: |
          $binary = "target/x86_64-pc-windows-msvc/release/openwifidiag.exe"
          if (-not (Test-Path $binary)) {
            throw "Expected Windows binary was not produced: $binary"
          }
