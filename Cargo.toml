[package]
name = "openwifidiag"
description = "A terminal-based WiFi network diagnostic tool"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc_exception = "0.1"

[lints.rust]
# objc 0.2's macros reference this cfg internally
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[profile.release]
opt-level = "z"
lto = true
